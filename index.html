<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defensoría del Pueblo - Sistema de Supervisión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003366">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="header-logo">
                <span>DEFENSORÍA DEL PUEBLO</span>
            </div>
            <button id="defensor-link" class="admin-link" style="background: rgba(255,255,255,0.1); border:none; color:white; padding:8px 15px; border-radius:8px; cursor:pointer;" onclick="adminLogin()">Admin 🔒</button>
        </div>
    </header>

    <main class="container">
        <!-- SECCIÓN 1: SELECCIÓN -->
        <section id="selection-section" class="selection-grid">
            <h2 style="text-align:center; margin: 20px 0; color: var(--primary);">¿Dónde supervisas hoy?</h2>
            <button id="choice-acp" class="selection-card" onclick="showAcpForm()">
                <div class="card-icon">🏢</div>
                <div>
                    <h3>Oficina Desconcentrada</h3>
                    <p>Registro de supervisión en OD/MOD</p>
                </div>
            </button>
            <button id="choice-plan" class="selection-card" onclick="showPlanForm()">
                <div class="card-icon">📍</div>
                <div>
                    <h3>Sede Central (Lima)</h3>
                    <p>Supervisión en puntos de movilización</p>
                </div>
            </button>
        </section>

        <!-- SECCIÓN 2: FORMULARIOS (Ocultos inicialmente) -->
        <section id="acp-section" class="card hidden">
            <button class="back-link" style="border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer; margin-bottom:15px;">⬅️ Volver</button>
            <h2>Supervisión OD/MOD</h2>
            <form id="acp-form">
                <div class="form-group">
                    <label>Nombre del Comisionado</label>
                    <input type="text" id="acp-supervisor" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label>Oficina (OD/MOD)</label>
                    <input type="text" id="acp-office" list="acp-office-list" placeholder="Selecciona oficina..." required>
                    <datalist id="acp-office-list"></datalist>
                </div>
                <button type="submit" class="btn-primary">Iniciar Registro 🚀</button>
            </form>
        </section>

        <section id="start-section" class="card hidden">
            <button class="back-link" style="border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer; margin-bottom:15px;">⬅️ Volver</button>
            <h2>Supervisión Lima</h2>
            <form id="start-form">
                <div class="form-group">
                    <label>Nombre del Comisionado</label>
                    <input type="text" id="name" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label>Nombre de la Protesta</label>
                    <input type="text" id="protest-name" list="protest-list-plan" placeholder="Colectivo o marcha..." required>
                    <datalist id="protest-list-plan"></datalist>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="category" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Espacio de movilización">Espacio de movilización</option>
                        <option value="Dependencia policial / Seguridad del Estado">Dependencia policial</option>
                        <option value="Establecimiento de salud">Establecimiento de salud</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Punto de Supervisión</label>
                    <input type="text" id="location" list="location-list" placeholder="Punto exacto..." required>
                    <datalist id="location-list"></datalist>
                </div>
                <button type="submit" class="btn-primary">Iniciar Supervisión 📍</button>
            </form>
        </section>

        <!-- SECCIÓN 3: SESIÓN ACTIVA -->
        <section id="active-section" class="card hidden" style="padding:0; overflow:hidden;">
            <div style="background:var(--primary); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:700;">🔵 EN VIVO</span>
                <div id="timer" style="font-family:monospace; font-size:1.2rem;">00:00:00</div>
            </div>
            
            <div id="minimapa-comisionado" style="height: 180px; width: 100%;"></div>
            
            <div style="padding:15px;">
                <p style="font-size:0.9rem; margin-bottom:5px;"><strong>Punto:</strong> <span id="display-location"></span></p>
                <p style="font-size:0.9rem; color:#666;"><strong>GPS:</strong> <span id="display-start-geo">Obteniendo...</span></p>
            </div>

            <div style="padding:15px; border-top:1px solid #eee;">
                <button id="add-incident-btn" class="btn-primary" style="background:#f39c12; margin-bottom:10px;">🚨 Reportar Incidencia</button>
                <button id="add-update-btn" class="btn-primary" style="background:#3498db;">📝 Enviar Actualización</button>
            </div>

            <div id="incidents-timeline" class="timeline-container" style="height:350px;">
                <!-- Feed dinámico -->
            </div>

            <button id="finish-btn" class="btn-primary" style="background:#e74c3c; border-radius:0; margin-top:10px;">Finalizar Supervisión</button>
        </section>

        <section id="history-section" class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Mis Registros</h3>
                <button id="export-btn" style="padding:5px 10px; border-radius:5px; border:1px solid #ddd; background:none; cursor:pointer;">CSV</button>
            </div>
            <div id="history-list" style="margin-top:15px;"></div>
        </section>
    </main>

    <!-- MODAL INCIDENCIAS -->
    <div id="incident-modal" class="modal hidden-modal">
        <div class="modal-content">
            <h3 id="modal-title">Nueva Incidencia</h3>
            <div class="form-group" id="incident-class-group">
                <label>Clasificación</label>
                <select id="incident-class">
                    <option value="Heridos">Heridos</option>
                    <option value="Fallecidos">Fallecidos</option>
                    <option value="Privados de la libertad">Privados de la libertad</option>
                    <option value="Enfrentamientos">Enfrentamientos</option>
                    <option value="Reporte de Situación" selected>Reporte de Situación</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad (Si aplica)</label>
                <input type="number" id="incidencia-cantidad" placeholder="Cantidad (Ej. 5)" min="1">
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="incident-desc" rows="3" placeholder="¿Qué está pasando?"></textarea>
            </div>
            <div class="form-group">
                <label>Foto (Cámara)</label>
                <input type="file" id="incident-photo" accept="image/*" capture="environment">
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="record-audio-btn" class="btn-primary" style="background:#2c3e50; font-size:0.8rem;">🎤 Grabar Voz</button>
                <button id="stop-audio-btn" class="btn-primary hidden" style="background:#c0392b; font-size:0.8rem;">🛑 Parar</button>
            </div>
            <audio id="audio-preview" controls class="hidden" style="width:100%; margin-bottom:15px;"></audio>
            <div style="display:flex; gap:10px;">
                <button id="cancel-incident-btn" class="btn-primary" style="background:#95a5a6;">Cancelar</button>
                <button id="save-incident-btn" class="btn-primary">Enviar ➡️</button>
            </div>
        </div>
    </div>

    <!-- MODAL WHATSAPP -->
    <div id="wa-modal" class="modal hidden-modal">
        <div class="modal-content">
            <h3>📢 Alerta Crítica</h3>
            <p style="margin-bottom:15px; color:#666;">¿A quién deseas notificar por WhatsApp?</p>
            <select id="wa-contact-select" class="form-group" style="padding:12px;"></select>
            <div style="display:flex; gap:10px;">
                <button id="wa-cancel-btn" class="btn-primary" style="background:#95a5a6;">Omitir</button>
                <button id="wa-send-btn" class="btn-primary">Enviar WhatsApp ✅</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
