<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero - Defensoría del Pueblo</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .map-wrapper { margin: 20px 0; background: white; padding: 10px; border-radius: 20px; box-shadow: var(--shadow); }
        #map-dashboard { height: 500px; width: 100%; border-radius: 15px; z-index: 1; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .feed-card { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; height: 700px; display: flex; flex-direction: column; }
        .feed-header { background: var(--primary); color: white; padding: 15px; font-weight: 700; }
        #global-feed { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="header-content" style="max-width: 1400px;">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="header-logo">
                <span>TABLERO DE SUPERVISIÓN</span>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="date" id="filter-date" style="padding:5px; border-radius:5px; border:none;">
                <select id="filter-protest" style="padding:5px; border-radius:5px; border:none; max-width:200px;">
                    <option value="all">Todas las protestas</option>
                </select>
                <button id="refresh-btn" style="background:var(--accent); color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:700;">Actualizar 🔄</button>
                <button id="timeline-btn" style="background:#34495e; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:700;">⏱️ Línea Tiempo</button>
                <button id="sync-gsheets-btn" style="background:#27ae60; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:700;">🔄 Sincronizar BI</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Estadísticas -->
        <section class="stats-grid">
            <div class="stat-card"><h3>Activas</h3><span class="stat-value" id="stat-active" style="color:var(--success);">0</span></div>
            <div class="stat-card"><h3>Incidencias</h3><span class="stat-value" id="stat-incidents" style="color:var(--accent);">0</span></div>
            <div class="stat-card"><h3>Heridos</h3><span class="stat-value" id="stat-heridos" style="color:#e67e22;">0</span></div>
            <div class="stat-card"><h3>Fallecidos</h3><span class="stat-value" id="stat-fallecidos" style="color:#c0392b;">0</span></div>
            <div class="stat-card"><h3>Privados Libertad</h3><span class="stat-value" id="stat-detenidos" style="color:#8e44ad;">0</span></div>
        </section>

        <!-- Mapa -->
        <div class="map-wrapper">
            <div id="map-dashboard"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 350px; gap: 20px; margin-top: 20px;">
            <!-- Feed (IZQUIERDA) -->
            <div class="feed-card" style="height: 800px;">
                <div class="feed-header">📡 Feed en Tiempo Real</div>
                <div id="global-feed"></div>
            </div>

            <!-- Supervisiones (DERECHA) -->
            <div class="card" style="height: 800px; overflow-y: auto;">
                <h2 id="list-title" style="font-size: 1.2rem;">Supervisiones Hoy</h2>
                <div id="loading" style="text-align:center; padding:50px; font-weight:700;">Cargando datos... ⏳</div>
                <div id="reports-list"></div>
            </div>
        </div>
    </main>

    <!-- MODAL LÍNEA DE TIEMPO -->
    <div id="timeline-modal" class="modal hidden-modal">
        <div class="modal-content" style="max-width: 800px; height: 80vh; display: flex; flex-direction: column;">
            <h3>Línea de Tiempo del Día</h3>
            <div id="timeline-content" style="flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; margin: 15px 0;"></div>
            <div style="display:flex; gap:10px;">
                <button id="copy-timeline-btn" class="btn-primary" style="background:var(--accent);">📋 Copiar Texto</button>
                <button id="close-timeline-btn" class="btn-primary" style="background:#95a5a6;">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
